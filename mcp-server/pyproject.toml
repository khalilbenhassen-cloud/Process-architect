[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "process-architect-mcp"
version = "0.1.0"
description = "MCP tools for business-process analysis and functional test drafting"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.2.0",
  "pydantic>=2.7.0"
]

[tool.setuptools]
py-modules = ["server", "process_engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
